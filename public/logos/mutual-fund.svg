<!-- Groww app icon: circle split by a mountain/chart silhouette into blue (top-left) and teal (bottom-right). Recreated from the official Google Play icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="presentation">
    <defs>
        <clipPath id="growwCircle">
            <circle cx="20" cy="20" r="20" />
        </clipPath>
    </defs>
    <g clip-path="url(#growwCircle)">
        <!-- Blue background (top-left half) -->
        <rect width="40" height="40" fill="#5D6BFF" />
        <!-- Teal bottom-right area, shaped like a mountain/chart silhouette -->
        <path d="M0 40 L0 28 L12 18 L18 24 L26 12 L40 22 L40 40 Z" fill="#1DE9B6" />
        <!-- White peak highlight -->
        <path d="M12 18 L18 24 L26 12 L28 14 L18 26 L10 20 Z" fill="#FFFFFF" opacity="0.15" />
    </g>
</svg>
